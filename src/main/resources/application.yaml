spring:
  application:
    name: social_backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  data:
    redis:
      host: localhost
      post: 6379
      timeout: 60000ms
      client_type: lettuce



  datasource:
    url: jdbc:mysql://localhost:3306/social_tt?useSSL=false
    username: root
    password: "01112004"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  refresh-token:
    expiration-ms: 604800000
  login-approval:
    risk-threshold: 70
    expiration-ms: 300000
    otp:
      email-enabled: ${LOGIN_OTP_EMAIL_ENABLED:false}
      debug-enabled: ${LOGIN_OTP_DEBUG_ENABLED:true}
  mail:
    from: ${MAIL_FROM:}

chat:
  rate-limit:
    messages-per-second: 5
    messages-per-minute: 30
    attachments-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
