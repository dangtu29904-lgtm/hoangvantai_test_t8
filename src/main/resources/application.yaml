spring:
  application:
    name: social_backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  data:
    redis:
      host: localhost
      post: 6379
      timeout: 60000ms
      client_type: lettuce



  datasource:
    url: jdbc:mysql://localhost:3306/social_tt?useSSL=false
    username: root
    password: "01112004"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
